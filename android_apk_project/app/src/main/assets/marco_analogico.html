<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marco Analógico - Oráculo</title>
    <style>
        :root {
            --bg-frame: #050407;
            --analog-sepia: 0.18;
            --analog-brightness: 0.94;
            --analog-contrast: 1.06;
            --grain-opacity: 0.18;
            --full-wear-opacity: 0.75;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-frame);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Marco responsive con proporciones de la Tablet Huawei MediaPad T5 (1023 x 1537) */
        .tablet-device-frame {
            position: relative;
            height: 100vh;
            max-height: 100vh;
            max-width: 100vw;
            aspect-ratio: 1023 / 1537;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020104;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        /* Contenedor del lienzo de la fotografía analógica */
        .photo-canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: sepia(var(--analog-sepia)) brightness(var(--analog-brightness)) contrast(var(--analog-contrast));
            transition: filter 0.3s ease;
            overflow: hidden;
        }

        /* CAPA 1: Carta Interactiva Completa */
        .card-anchor {
            position: absolute;
            left: 11.05%;
            top: 39.82%;
            width: 20.53%;
            height: 20.63%;
            z-index: 10;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.35, 1);
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            background: #caa968;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Cara posterior (Dorso Completo Vintage) */
        .card-back-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            display: block;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 1;
            background: #caa968;
            box-sizing: border-box;
        }

        .card-back-side img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            border-radius: 3px;
        }

        /* Cara frontal (Carta completa revelada en papel kraft continuo con proyección litográfica) */
        .card-front-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            display: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            background: linear-gradient(135deg, #dfc282 0%, #caa968 45%, #b5924e 100%);
            z-index: 2;
            padding: 3px 4px 6px 4px;
            box-sizing: border-box;
        }

        /* Estado Revelado: La cara frontal cubre 100% y el dorso queda totalmente oculto */
        .card-anchor.revealed .card-front-side {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .card-anchor.revealed .card-back-side {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* Vector litográfico proyectado sobre el papel */
        .card-front-side img.card-svg-art {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            mix-blend-mode: multiply;
            filter: sepia(0.65) saturate(1.2) contrast(1.1);
        }

        /* CAPA 2: Fotografía PNG con Ventana Transparente (Dedos y bordes solapados) */
        .base-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* CAPA 3: Efectos aplicados a TODA LA FOTOGRAFÍA MONTADA */
        .full-frame-wear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: multiply;
            opacity: var(--full-wear-opacity);
        }

        .full-frame-dust-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 26;
            mix-blend-mode: screen;
            opacity: 0.65;
        }

        .analog-grain-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .analog-vignette {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 31;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(15,8,3,0.65) 100%);
        }

        .status-dot {
            position: fixed;
            bottom: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            z-index: 100;
            transition: all 0.3s;
        }
        .status-dot.pulse {
            background: rgba(16, 185, 129, 0.9);
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.error {
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 8px #ef4444;
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 17, 29, 0.92);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .toast-msg.show {
            opacity: 1;
        }

        .secret-tap-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            z-index: 500;
            cursor: default;
        }

        .btn-settings-toggle {
            position: fixed;
            bottom: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(20, 17, 29, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        .btn-settings-toggle:hover {
            background: rgba(20, 17, 29, 0.9);
            color: #d4af37;
            border-color: #d4af37;
        }

        /* Modal de Configuración */
        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #14111d;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 440px);
            color: #f1ebd8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-card h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 14px;
            text-align: center;
        }

        .info-badge {
            background: #1d182b;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4b5fd;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 0.85rem;
            color: #a89bbd;
            margin-bottom: 6px;
        }

        .setting-row input[type="text"], .setting-row select {
            width: 100%;
            padding: 10px;
            background: #1e1a2b;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
        }

        .setting-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
        }
        .btn-gold:hover {
            background: #f1cf68;
        }

        .btn-dark {
            background: #2a253b;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <script>
        const FONDOS_CONFIG = {"static/fondos/fondo_8.png": {"label": "Arlequ\u00edn Luna (Original)", "left": "11.05%", "top": "39.82%", "width": "20.53%", "height": "20.63%"}, "static/fondos/fondo_1.png": {"label": "Or\u00e1culo Cl\u00e1sico", "left": "10.95%", "top": "39.82%", "width": "20.14%", "height": "20.36%"}, "static/fondos/fondo_2.png": {"label": "Noche Misterio", "left": "19.55%", "top": "38.65%", "width": "19.65%", "height": "20.43%"}, "static/fondos/fondo_3.png": {"label": "Marco Antiguo", "left": "21.11%", "top": "40.99%", "width": "18.87%", "height": "19.58%"}, "static/fondos/fondo_4.png": {"label": "Placa Iluminada", "left": "28.15%", "top": "40.21%", "width": "21.11%", "height": "21.41%"}, "static/fondos/fondo_5.png": {"label": "Escena M\u00e1gica", "left": "14.27%", "top": "40.99%", "width": "25.02%", "height": "25.37%"}, "static/fondos/fondo_6.png": {"label": "Conejo de Alicia", "left": "10.80%", "top": "39.50%", "width": "20.50%", "height": "20.50%"}, "static/fondos/fondo_7.png": {"label": "Gato Elegante", "left": "10.80%", "top": "32.50%", "width": "21.00%", "height": "21.00%"}, "static/fondos/fondo_9.png": {"label": "Pulpo Ilusionista", "left": "10.80%", "top": "39.50%", "width": "20.50%", "height": "20.50%"}};

        let API_URL = localStorage.getItem('marco_api_url') || (window.location.origin && window.location.origin.includes('vercel.app') ? '/api/carta_actual' : 'https://codigo-carta.vercel.app/api/carta_actual');
        let currentBg = localStorage.getItem('marco_selected_bg') || 'static/fondos/fondo_8.png';
        let currentMode = localStorage.getItem('marco_mode') || (window.Android ? 'auto' : 'manual');
        let isRevealed = false;
        let isTestMode = false;
        let isFetching = false;
        let activeCardName = '';
        let lastVersion = null;
        let lastUpdatedAt = null;
        let pollingTimer = null;
        const POLLING_INTERVAL_MS = 4000;

        const basePhoto = document.getElementById('basePhoto');
        const bgSelect = document.getElementById('bgSelect');
        const modeSelect = document.getElementById('modeSelect');
        const cardAnchor = document.getElementById('cardAnchor');
        const cardFrontImg = document.getElementById('cardFrontImg');
        const settingsModal = document.getElementById('settingsModal');
        const secretZone = document.getElementById('secretZone');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const statusDot = document.getElementById('statusDot');
        const toastMsg = document.getElementById('toastMsg');
        const diagStatus = document.getElementById('diagStatus');
        const diagCard = document.getElementById('diagCard');

        function showToast(msg) {
            if (!toastMsg) return;
            toastMsg.textContent = msg;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 2500);
        }

        function setDeviceBrightness(valPercent) {
            const floatVal = valPercent / 100.0;
            if (window.Android && window.Android.setBrightness) {
                try {
                    window.Android.setBrightness(floatVal);
                } catch(e) {
                    console.log('Bridge Android error:', e);
                }
            }
        }

        // Aplicar fondo y calibrar coordenadas exactas
        function applyBackground(bgKey) {
            if (!FONDOS_CONFIG[bgKey]) {
                bgKey = 'static/fondos/fondo_8.png';
            }
            currentBg = bgKey;
            basePhoto.src = currentBg;
            bgSelect.value = currentBg;

            const cfg = FONDOS_CONFIG[currentBg];
            if (cfg) {
                cardAnchor.style.left = cfg.left;
                cardAnchor.style.top = cfg.top;
                cardAnchor.style.width = cfg.width;
                cardAnchor.style.height = cfg.height;
            }
        }

        applyBackground(currentBg);
        modeSelect.value = currentMode;

        bgSelect.addEventListener('change', (e) => {
            const newBg = e.target.value;
            if (newBg) {
                applyBackground(newBg);
                localStorage.setItem('marco_selected_bg', currentBg);
            }
        });

        // Restaurar configuraciones persistentes
        const savedBright = localStorage.getItem('marco_brightness') || 30;
        const savedSepia = localStorage.getItem('marco_sepia') || 18;
        const savedGrain = localStorage.getItem('marco_grain') || 18;
        const savedFullWear = localStorage.getItem('marco_full_wear') || 75;

        setDeviceBrightness(savedBright);
        document.documentElement.style.setProperty('--analog-sepia', (savedSepia / 100.0));
        document.documentElement.style.setProperty('--grain-opacity', (savedGrain / 100.0));
        document.documentElement.style.setProperty('--full-wear-opacity', (savedFullWear / 100.0));

        // Revelación limpia y directa
        window.revealCard = function(valor, palo_id, fromTestSelector = false) {
            isRevealed = true;
            if (fromTestSelector) {
                isTestMode = true;
            }
            activeCardName = `${valor} de ${palo_id}`;

            if (currentMode === 'auto' && pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }

            const svgSrc = `cartas_svg/${valor}_${palo_id}.svg`;
            
            const tempImg = new Image();
            tempImg.onload = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.onerror = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.src = svgSrc;

            if (statusDot) {
                statusDot.className = 'status-dot pulse';
                setTimeout(() => statusDot.className = 'status-dot', 2500);
            }
            if (diagStatus) diagStatus.textContent = isTestMode ? 'Modo Prueba Fijo' : '¡Carta Revelada!';
            if (diagCard) diagCard.textContent = activeCardName;
        };

        function resetToDorso() {
            isRevealed = false;
            isTestMode = false;
            activeCardName = '';
            cardAnchor.classList.remove('revealed');
            lastVersion = null;
            lastUpdatedAt = null;
            testCardSelect.value = '';
            if (diagStatus) diagStatus.textContent = currentMode === 'auto' ? 'Polling activo (4s)' : 'Manual (Listo)';
            if (diagCard) diagCard.textContent = 'Dorso inicial';
            if (currentMode === 'auto') startPolling();
        }

        async function pollApi(forceRevealNow = false) {
            if ((isRevealed || isTestMode) && !forceRevealNow) return;

            try {
                const fetchUrl = API_URL.includes('?') ? `${API_URL}&_t=${Date.now()}` : `${API_URL}?_t=${Date.now()}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(fetchUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    if (statusDot) {
                        statusDot.className = 'status-dot pulse';
                        setTimeout(() => statusDot.className = 'status-dot', 600);
                    }

                    if (forceRevealNow && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id, false);
                        return;
                    }

                    if (lastVersion === null && lastUpdatedAt === null) {
                        lastVersion = data.version || 0;
                        lastUpdatedAt = data.updated_at || '';
                        return;
                    }

                    const versionChanged = (data.version && data.version !== lastVersion);
                    const timeChanged = (data.updated_at && data.updated_at !== lastUpdatedAt);

                    if ((versionChanged || timeChanged) && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id, false);
                    }
                } else {
                    if (statusDot) {
                        statusDot.className = 'status-dot error';
                        setTimeout(() => statusDot.className = 'status-dot', 800);
                    }
                }
            } catch (err) {
                if (statusDot) {
                    statusDot.className = 'status-dot error';
                    setTimeout(() => statusDot.className = 'status-dot', 800);
                }
            }
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            if (currentMode !== 'auto' || isTestMode || isRevealed) return;
            pollApi();
            pollingTimer = setInterval(() => pollApi(false), POLLING_INTERVAL_MS);
        }

        if (currentMode === 'auto') {
            startPolling();
        }

        // Al hacer clic en la carta
        async function handleCardClick(e) {
            if (e) e.stopPropagation();

            if (!cardAnchor.classList.contains('revealed')) {
                if (isFetching) return;
                isFetching = true;
                showToast('Consultando oráculo...');
                await pollApi(true);
                isFetching = false;
            } else {
                resetToDorso();
            }
        }

        cardAnchor.addEventListener('click', handleCardClick);

        // Control del menú de configuración
        let pressTimer = null;
        function openSettings() {
            settingsModal.classList.add('show');
        }

        btnOpenSettings.addEventListener('click', openSettings);
        secretZone.addEventListener('touchstart', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('touchend', () => clearTimeout(pressTimer));
        secretZone.addEventListener('mousedown', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // Doble clic en cualquier parte de la imagen para abrir la configuración
        const photoContainer = document.getElementById('photoContainer');
        if (photoContainer) {
            photoContainer.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                openSettings();
            });
        }
        document.body.addEventListener('dblclick', (e) => {
            if (!settingsModal.classList.contains('show')) {
                openSettings();
            }
        });

        const apiUrlInput = document.getElementById('apiUrlInput');
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const sepiaVal = document.getElementById('sepiaVal');
        const grainSlider = document.getElementById('grainSlider');
        const grainVal = document.getElementById('grainVal');
        const fullWearSlider = document.getElementById('fullWearSlider');
        const fullWearVal = document.getElementById('fullWearVal');
        const testCardSelect = document.getElementById('testCardSelect');
        const btnSave = document.getElementById('btnSave');
        const btnResetDorso = document.getElementById('btnResetDorso');
        const btnForceCheck = document.getElementById('btnForceCheck');

        apiUrlInput.value = API_URL;
        brightSlider.value = savedBright;
        brightVal.textContent = savedBright + '%';
        sepiaSlider.value = savedSepia;
        sepiaVal.textContent = savedSepia + '%';
        grainSlider.value = savedGrain;
        grainVal.textContent = savedGrain + '%';
        fullWearSlider.value = savedFullWear;
        fullWearVal.textContent = savedFullWear + '%';

        brightSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            brightVal.textContent = v + '%';
            setDeviceBrightness(v);
        });

        sepiaSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            sepiaVal.textContent = v + '%';
            document.documentElement.style.setProperty('--analog-sepia', (v / 100.0));
        });

        grainSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            grainVal.textContent = v + '%';
            document.documentElement.style.setProperty('--grain-opacity', (v / 100.0));
        });

        fullWearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            fullWearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--full-wear-opacity', (v / 100.0));
        });

        testCardSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                const parts = val.split('_');
                window.revealCard(parts[0], parts[1], true);
            }
        });

        btnSave.addEventListener('click', () => {
            API_URL = apiUrlInput.value.trim() || 'https://codigo-carta.vercel.app/api/carta_actual';
            currentMode = modeSelect.value;
            localStorage.setItem('marco_mode', currentMode);
            localStorage.setItem('marco_api_url', API_URL);
            localStorage.setItem('marco_selected_bg', currentBg);
            localStorage.setItem('marco_brightness', brightSlider.value);
            localStorage.setItem('marco_sepia', sepiaSlider.value);
            localStorage.setItem('marco_grain', grainSlider.value);
            localStorage.setItem('marco_full_wear', fullWearSlider.value);

            settingsModal.classList.remove('show');

            if (currentMode === 'auto') {
                startPolling();
            } else {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
            }
        });

        btnResetDorso.addEventListener('click', () => {
            resetToDorso();
            settingsModal.classList.remove('show');
        });

        btnForceCheck.addEventListener('click', () => {
            settingsModal.classList.remove('show');
            pollApi(true);
        });
    </script>
</body>
</html>
