<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marco Analógico - Oráculo</title>
    <style>
        :root {
            --bg-frame: #020104;
            --analog-sepia: 0.22;
            --analog-brightness: 0.92;
            --analog-contrast: 1.08;
            --grain-opacity: 0.22;
            --full-wear-opacity: 0.85;
            --card-wear-opacity: 0.85;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-frame);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Contenedor del lienzo de la fotografía analógica completa */
        .photo-canvas-container {
            position: relative;
            height: 100vh;
            max-width: 100vw;
            aspect-ratio: 681 / 1024;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050407;
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.98);
            filter: sepia(var(--analog-sepia)) brightness(var(--analog-brightness)) contrast(var(--analog-contrast));
            transition: filter 0.3s ease;
            overflow: hidden;
        }

        /* Fotografía base del arlequín y la luna */
        .base-photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Área de la carta interactiva (ajustada al milímetro con el hueco de las manos) */
        .card-anchor {
            position: absolute;
            left: 10.866%;
            top: 38.965%;
            width: 20.411%;
            height: 19.824%;
            perspective: 1000px;
            z-index: 10;
            cursor: pointer;
        }

        .card-flipper {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.85s cubic-bezier(0.25, 1, 0.35, 1);
            border-radius: 4.5%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
        }

        .card-anchor.revealed .card-flipper {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4.5%;
            overflow: hidden;
        }

        /* Cara posterior (Dorso original) */
        .card-back-side {
            transform: rotateY(0deg);
            background-color: #2b2318;
            border: 1px solid rgba(50, 30, 10, 0.5);
        }

        .card-back-side img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* Cara frontal (Papel Ocre Real + SVG en Multiply + Máscara de Desgaste Real) */
        .card-front-side {
            transform: rotateY(180deg);
            background: #2b1f14;
            border-radius: 4.5%;
            border: 1px solid rgba(40, 20, 5, 0.85);
            box-shadow: 
                inset 1px 1px 2px rgba(255, 235, 190, 0.4),
                inset -1px -1px 2px rgba(20, 10, 2, 0.25),
                inset 0 0 6px rgba(35, 18, 5, 0.30);
            position: relative;
            overflow: hidden;
        }

        /* Capa 1: Fondo de Papel Ocre con grietas de tiempo */
        .card-bg-paper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            z-index: 1;
        }

        /* Capa 2: Tinta litográfica de la carta en Multiply */
        .card-front-side img.card-svg-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            z-index: 2;
            filter: sepia(0.85) saturate(1.35) brightness(0.88) contrast(1.25);
            mix-blend-mode: multiply;
        }

        /* Capa 3: Máscara de arañazos, manchas y bordes rotos de la carta en Multiply */
        .card-wear-mask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            z-index: 3;
            mix-blend-mode: multiply;
            opacity: var(--card-wear-opacity);
            pointer-events: none;
        }

        /* Capa 4: Sombra direccional ambiental ultraligera (esquina inferior derecha despejada para leer índices/números) */
        .card-front-side::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(circle at 15% 15%, rgba(255,255,255,0.14) 0%, rgba(0,0,0,0) 70%, rgba(25,12,3,0.12) 100%),
                        linear-gradient(to bottom right, rgba(0,0,0,0) 80%, rgba(18,9,2,0.10) 100%);
            mix-blend-mode: multiply;
        }

        /* Dedos del payaso en primer plano */
        .fingers-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            object-fit: contain;
        }

        /* --- EFECTOS DE ENVEJECIMIENTO PARA TODA LA FOTOGRAFÍA --- */

        /* 1. Máscara de desgaste analógico general (Bordes erosionados, manchas de tiempo, arañazos) */
        .full-frame-wear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: multiply;
            opacity: var(--full-wear-opacity);
        }

        /* 2. Micro-polvo, motas de sales de plata y arañazos finos de placa fotográfica */
        .full-frame-dust-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 26;
            mix-blend-mode: screen;
            opacity: 0.75;
        }

        /* 3. Textura de grano de película analógica de alta densidad */
        .analog-grain-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* 4. Viñeteado fotográfico de lente antigua */
        .analog-vignette {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 31;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(15,8,3,0.65) 100%);
        }

        .status-dot {
            position: fixed;
            bottom: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            z-index: 100;
            transition: all 0.3s;
        }
        .status-dot.pulse {
            background: rgba(16, 185, 129, 0.9);
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.error {
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 8px #ef4444;
        }

        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #14111d;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 440px);
            color: #f1ebd8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-card h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 14px;
            text-align: center;
        }

        .diagnostic-box {
            background: #1d182b;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4b5fd;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 0.85rem;
            color: #a89bbd;
            margin-bottom: 6px;
        }

        .setting-row input[type="text"], .setting-row select {
            width: 100%;
            padding: 10px;
            background: #1e1a2b;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
        }

        .setting-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
        }
        .btn-gold:hover {
            background: #f1cf68;
        }

        .btn-dark {
            background: #2a253b;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .secret-tap-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 90px;
            height: 90px;
            z-index: 500;
        }
    </style>
</head>
<body>

    <div class="photo-canvas-container" id="photoContainer">
        <!-- 1. Fotografía original base -->
        <img class="base-photo" id="basePhoto" src="cartas_svg/fondo_oraculo_dorso.jpg" alt="Oráculo Analógico" onerror="this.src='static/base_dorso.jpg'">

        <!-- 2. Carta Interactiva (Dorso / Frente) -->
        <div class="card-anchor" id="cardAnchor" title="Toca para forzar volteo">
            <div class="card-flipper">
                <!-- Dorso -->
                <div class="card-side card-back-side">
                    <img id="cardBackImg" src="cartas_svg/dorso_card_crop.jpg" onerror="this.src='static/dorso_card_crop.jpg'" alt="Dorso">
                </div>
                <!-- Frente con Papel Ocre Real + SVG + Máscara de Desgaste -->
                <div class="card-side card-front-side">
                    <img class="card-bg-paper" src="static/paper_vintage_ocher.jpg" onerror="this.src='cartas_svg/paper_vintage_ocher.jpg'" alt="Papel Ocre">
                    <img class="card-svg-art" id="cardFrontImg" src="cartas_svg/K_corazones.svg" alt="Carta Revelada">
                    <img class="card-wear-mask" src="static/card_wear_mask.jpg" onerror="this.src='cartas_svg/card_wear_mask.jpg'" alt="Desgaste">
                </div>
            </div>
        </div>

        <!-- 3. Dedos del payaso en primer plano -->
        <img class="fingers-overlay" id="fingersOverlay" src="static/fingers_overlay.png" onerror="this.style.display='none'" alt="Dedos">

        <!-- 4. Máscara de Desgaste Fotográfico para TODA la Imagen (Bordes erosionados, manchas, pátina) -->
        <img class="full-frame-wear-overlay" id="fullWearOverlay" src="static/full_frame_vintage_mask.jpg" onerror="this.src='cartas_svg/full_frame_vintage_mask.jpg'" alt="Desgaste Cuadro">

        <!-- 5. Micro-polvo y fibras de película analógica -->
        <img class="full-frame-dust-overlay" src="static/full_frame_dust.png" onerror="this.src='cartas_svg/full_frame_dust.png'" alt="Polvo Analógico">

        <!-- 6. Grano de película analógica y viñeteado de época -->
        <div class="analog-grain-overlay" id="grainOverlay"></div>
        <div class="analog-vignette"></div>
    </div>

    <div class="status-dot" id="statusDot" title="Diagnóstico de red"></div>
    <div class="secret-tap-zone" id="secretZone" title="Mantener 2.5s para configurar"></div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <h3>⚙️ Configuración del Marco</h3>
            
            <div class="diagnostic-box" id="diagnosticBox">
                <div>📡 <b>API:</b> <span id="diagUrl">...</span></div>
                <div>⏱️ <b>Último poll:</b> <span id="diagTime">Esperando...</span></div>
                <div>🃏 <b>Carta en servidor:</b> <span id="diagCard">Ninguna</span></div>
                <div>🔄 <b>Estado:</b> <span id="diagStatus">Polling activo (4s)</span></div>
            </div>

            <div class="setting-row">
                <label>URL de la API:</label>
                <input type="text" id="apiUrlInput" value="https://codigo-carta.vercel.app/api/carta_actual">
            </div>

            <div class="setting-row">
                <label>Brillo de Hardware (Tablet): <span id="brightVal">30%</span></label>
                <input type="range" id="brightSlider" min="5" max="100" value="30">
            </div>

            <div class="setting-row">
                <label>Tono Sepia Analógico: <span id="sepiaVal">22%</span></label>
                <input type="range" id="sepiaSlider" min="0" max="80" value="22">
            </div>

            <div class="setting-row">
                <label>Grano Analógico de Película: <span id="grainVal">22%</span></label>
                <input type="range" id="grainSlider" min="0" max="60" value="22">
            </div>

            <div class="setting-row">
                <label>Desgaste de Toda la Fotografía: <span id="fullWearVal">85%</span></label>
                <input type="range" id="fullWearSlider" min="0" max="100" value="85">
            </div>

            <div class="setting-row">
                <label>Intensidad de Desgaste (Carta): <span id="wearVal">85%</span></label>
                <input type="range" id="wearSlider" min="20" max="100" value="85">
            </div>

            <div class="setting-row">
                <label>Probar Carta Manualmente:</label>
                <select id="testCardSelect">
                    <option value="">-- Seleccionar Carta para probar --</option>
                    <option value="A_picas">As de Picas (A♠)</option>
                    <option value="K_corazones">Rey de Corazones (K♥)</option>
                    <option value="Q_diamantes">Reina de Diamantes (Q♦)</option>
                    <option value="J_treboles">Jota de Tréboles (J♣)</option>
                    <option value="7_diamantes">7 de Diamantes (7♦)</option>
                    <option value="7_treboles">7 de Tréboles (7♣)</option>
                    <option value="8_treboles">8 de Tréboles (8♣)</option>
                    <option value="10_corazones">10 de Corazones (10♥)</option>
                    <option value="3_picas">3 de Picas (3♠)</option>
                </select>
            </div>

            <div class="setting-actions">
                <button class="btn btn-gold" id="btnForceCheck">⚡ Forzar Consulta y Revelar Ahora</button>
                <button class="btn btn-dark" id="btnResetDorso">🔄 Reiniciar al Dorso y Reanudar Polling</button>
                <button class="btn btn-gold" id="btnSave">Guardar y Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let API_URL = localStorage.getItem('marco_api_url') || 'https://codigo-carta.vercel.app/api/carta_actual';
        let isRevealed = false;
        let lastVersion = null;
        let lastUpdatedAt = null;
        let pollingTimer = null;
        const POLLING_INTERVAL_MS = 4000;

        const cardAnchor = document.getElementById('cardAnchor');
        const cardFrontImg = document.getElementById('cardFrontImg');
        const statusDot = document.getElementById('statusDot');
        const settingsModal = document.getElementById('settingsModal');
        const secretZone = document.getElementById('secretZone');

        const diagUrl = document.getElementById('diagUrl');
        const diagTime = document.getElementById('diagTime');
        const diagCard = document.getElementById('diagCard');
        const diagStatus = document.getElementById('diagStatus');

        function updateDiag(url, time, card, status) {
            if (diagUrl) diagUrl.textContent = url || API_URL;
            if (diagTime) diagTime.textContent = time || new Date().toLocaleTimeString();
            if (diagCard) diagCard.textContent = card || 'Ninguna';
            if (diagStatus) diagStatus.textContent = status || (isRevealed ? 'Carta Revelada (Polling detenido)' : 'Polling activo');
        }

        function setDeviceBrightness(valPercent) {
            const floatVal = valPercent / 100.0;
            if (window.Android && window.Android.setBrightness) {
                try {
                    window.Android.setBrightness(floatVal);
                } catch(e) {
                    console.log('Bridge Android error:', e);
                }
            }
        }

        const savedBright = localStorage.getItem('marco_brightness') || 30;
        setDeviceBrightness(savedBright);

        window.revealCard = function(valor, palo_id) {
            if (isRevealed) return;
            isRevealed = true;

            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
                console.log('[MARCO] Polling detenido tras revelación exitosa.');
            }

            console.log(`[MARCO] Revelando carta: ${valor} de ${palo_id}`);
            const svgSrc = `cartas_svg/${valor}_${palo_id}.svg`;
            
            const tempImg = new Image();
            tempImg.onload = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.onerror = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.src = svgSrc;

            if (statusDot) {
                statusDot.className = 'status-dot pulse';
                setTimeout(() => statusDot.className = 'status-dot', 2500);
            }
            updateDiag(API_URL, new Date().toLocaleTimeString(), `${valor} de ${palo_id}`, '¡Carta Revelada!');
        };

        function resetToDorso() {
            isRevealed = false;
            cardAnchor.classList.remove('revealed');
            lastVersion = null;
            lastUpdatedAt = null;
            updateDiag(API_URL, new Date().toLocaleTimeString(), 'Reiniciado a Dorso', 'Polling activo (4s)');
            startPolling();
        }

        async function pollApi(forceRevealNow = false) {
            if (isRevealed && !forceRevealNow) return;

            try {
                const fetchUrl = API_URL.includes('?') ? `${API_URL}&_t=${Date.now()}` : `${API_URL}?_t=${Date.now()}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(fetchUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    const nowStr = new Date().toLocaleTimeString();
                    
                    if (statusDot) {
                        statusDot.className = 'status-dot pulse';
                        setTimeout(() => statusDot.className = 'status-dot', 600);
                    }

                    const cardName = `${data.valor || ''} de ${data.palo_nombre || data.palo_id || ''}`;
                    updateDiag(API_URL, nowStr, cardName, isRevealed ? 'Revelada' : 'Polling activo');

                    if (forceRevealNow && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id);
                        return;
                    }

                    if (lastVersion === null && lastUpdatedAt === null) {
                        lastVersion = data.version || 0;
                        lastUpdatedAt = data.updated_at || '';
                        console.log('[MARCO] Estado inicial sincronizado:', lastVersion, lastUpdatedAt);
                        return;
                    }

                    const versionChanged = (data.version && data.version !== lastVersion);
                    const timeChanged = (data.updated_at && data.updated_at !== lastUpdatedAt);

                    if ((versionChanged || timeChanged) && data.valor && data.palo_id) {
                        console.log('[MARCO] ¡Detectado cambio de carta en servidor!');
                        window.revealCard(data.valor, data.palo_id);
                    }
                } else {
                    if (statusDot) {
                        statusDot.className = 'status-dot error';
                        setTimeout(() => statusDot.className = 'status-dot', 800);
                    }
                    updateDiag(API_URL, new Date().toLocaleTimeString(), 'Error HTTP ' + res.status, 'Fallo de respuesta');
                }
            } catch (err) {
                console.error('[MARCO] Error polling API:', err);
                if (statusDot) {
                    statusDot.className = 'status-dot error';
                    setTimeout(() => statusDot.className = 'status-dot', 800);
                }
                updateDiag(API_URL, new Date().toLocaleTimeString(), 'Error de conexión', err.message);
            }
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            pollApi();
            pollingTimer = setInterval(() => pollApi(false), POLLING_INTERVAL_MS);
            console.log('[MARCO] Polling iniciado cada 4s en:', API_URL);
        }

        startPolling();

        cardAnchor.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isRevealed) {
                pollApi(true);
            } else {
                cardAnchor.classList.toggle('revealed');
            }
        });

        let pressTimer = null;
        function openSettings() {
            settingsModal.classList.add('show');
            updateDiag(API_URL, null, null, null);
        }

        secretZone.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(openSettings, 2200);
        });
        secretZone.addEventListener('touchend', () => clearTimeout(pressTimer));
        secretZone.addEventListener('mousedown', () => {
            pressTimer = setTimeout(openSettings, 2200);
        });
        secretZone.addEventListener('mouseup', () => clearTimeout(pressTimer));

        const apiUrlInput = document.getElementById('apiUrlInput');
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const sepiaVal = document.getElementById('sepiaVal');
        const grainSlider = document.getElementById('grainSlider');
        const grainVal = document.getElementById('grainVal');
        const fullWearSlider = document.getElementById('fullWearSlider');
        const fullWearVal = document.getElementById('fullWearVal');
        const wearSlider = document.getElementById('wearSlider');
        const wearVal = document.getElementById('wearVal');
        const testCardSelect = document.getElementById('testCardSelect');
        const btnSave = document.getElementById('btnSave');
        const btnResetDorso = document.getElementById('btnResetDorso');
        const btnForceCheck = document.getElementById('btnForceCheck');

        apiUrlInput.value = API_URL;
        brightSlider.value = savedBright;
        brightVal.textContent = savedBright + '%';

        brightSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            brightVal.textContent = v + '%';
            setDeviceBrightness(v);
        });

        sepiaSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            sepiaVal.textContent = v + '%';
            document.documentElement.style.setProperty('--analog-sepia', (v / 100.0));
        });

        grainSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            grainVal.textContent = v + '%';
            document.documentElement.style.setProperty('--grain-opacity', (v / 100.0));
        });

        fullWearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            fullWearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--full-wear-opacity', (v / 100.0));
        });

        wearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            wearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--card-wear-opacity', (v / 100.0));
        });

        testCardSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                const parts = val.split('_');
                window.revealCard(parts[0], parts[1]);
            }
        });

        btnForceCheck.addEventListener('click', () => {
            pollApi(true);
            settingsModal.classList.remove('show');
        });

        btnSave.addEventListener('click', () => {
            API_URL = apiUrlInput.value.trim() || 'https://codigo-carta.vercel.app/api/carta_actual';
            localStorage.setItem('marco_api_url', API_URL);
            localStorage.setItem('marco_brightness', brightSlider.value);
            settingsModal.classList.remove('show');
            if (!isRevealed) startPolling();
        });

        btnResetDorso.addEventListener('click', () => {
            resetToDorso();
            settingsModal.classList.remove('show');
        });
    </script>
</body>
</html>
