<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marco Analógico - Oráculo</title>
    <style>
        :root {
            --bg-frame: #050407;
            --analog-sepia: 0.18;
            --analog-brightness: 0.94;
            --analog-contrast: 1.06;
            --grain-opacity: 0.18;
            --full-wear-opacity: 0.75;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-frame);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Marco que replica las proporciones de la Tablet Huawei MediaPad T5 (16:10 portrait / 1023 x 1537) */
        .tablet-device-frame {
            position: relative;
            height: 100vh;
            max-height: 100vh;
            max-width: 100vw;
            aspect-ratio: 1023 / 1537;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020104;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        /* Contenedor del lienzo de la fotografía analógica */
        .photo-canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: sepia(var(--analog-sepia)) brightness(var(--analog-brightness)) contrast(var(--analog-contrast));
            transition: filter 0.3s ease;
            overflow: hidden;
        }

        /* CAPA 1: Carta Interactiva (Ubicada detrás del marco transparente) */
        .card-anchor {
            position: absolute;
            left: 11.6%;
            top: 40.3%;
            width: 19.3%;
            height: 19.8%;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.35, 1);
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            background: #caa968;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Cara posterior (Dorso Vintage Oro/Ocre Bicycle 1800) */
        .card-back-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.30s ease;
            z-index: 1;
            background: #1b170c;
        }

        .card-back-side img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* Cara frontal (Valores de la carta en tono Ocre/Oro con margen de seguridad inferior) */
        .card-front-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.30s ease;
            background: linear-gradient(135deg, #dfc282 0%, #caa968 45%, #b5924e 100%);
            z-index: 2;
            padding: 2px 3px 6px 3px;
            box-sizing: border-box;
        }

        /* Sustitución limpia al revelarse */
        .card-anchor.revealed .card-front-side {
            opacity: 1;
        }
        .card-anchor.revealed .card-back-side {
            opacity: 0;
        }

        /* Imagen vectorial de la carta en multiply */
        .card-front-side img.card-svg-art {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            mix-blend-mode: multiply;
            filter: sepia(0.65) saturate(1.2) contrast(1.1);
        }

        /* CAPA 2: Fotografía PNG con Ventana Transparente */
        .base-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* CAPA 3: Efectos aplicados a TODA LA FOTOGRAFÍA MONTADA */
        .full-frame-wear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: multiply;
            opacity: var(--full-wear-opacity);
        }

        .full-frame-dust-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 26;
            mix-blend-mode: screen;
            opacity: 0.65;
        }

        .analog-grain-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .analog-vignette {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 31;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(15,8,3,0.65) 100%);
        }

        /* Notificación discreta de carga o error */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 17, 29, 0.92);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .toast-msg.show {
            opacity: 1;
        }

        /* Zona secreta y botón discreto de configuración */
        .secret-tap-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            z-index: 500;
            cursor: default;
        }

        .btn-settings-toggle {
            position: fixed;
            bottom: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(20, 17, 29, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        .btn-settings-toggle:hover {
            background: rgba(20, 17, 29, 0.9);
            color: #d4af37;
            border-color: #d4af37;
        }

        /* Modal de Configuración */
        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #14111d;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 440px);
            color: #f1ebd8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-card h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 14px;
            text-align: center;
        }

        .info-badge {
            background: #1d182b;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4b5fd;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 0.85rem;
            color: #a89bbd;
            margin-bottom: 6px;
        }

        .setting-row input[type="text"], .setting-row select {
            width: 100%;
            padding: 10px;
            background: #1e1a2b;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
        }

        .setting-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
        }
        .btn-gold:hover {
            background: #f1cf68;
        }

        .btn-dark {
            background: #2a253b;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="tablet-device-frame">
        <div class="photo-canvas-container" id="photoContainer">
            <!-- 1. Carta Interactiva (Click para revelar/ocultar) -->
            <div class="card-anchor" id="cardAnchor" title="Toca la carta para revelar">
                <div class="card-container">
                    <!-- Dorso Vintage Oro -->
                    <div class="card-back-side">
                        <img id="cardBackImg" src="/cartas_svg/dorso_card_crop.jpg" onerror="this.src='/static/dorso_card_crop.jpg'" alt="Dorso">
                    </div>
                    <!-- Frente con Carta en tono pergamino a juego -->
                    <div class="card-front-side">
                        <img class="card-svg-art" id="cardFrontImg" src="/cartas_svg/K_corazones.svg" alt="Carta Revelada">
                    </div>
                </div>
            </div>

            <!-- 2. Fotografía PNG con Ventana Transparente -->
            <img class="base-photo" id="basePhoto" src="/static/fondos/fondo_6.png" alt="Fondo Marco" onerror="this.src='/cartas_svg/fondo_oraculo_dorso.jpg'">

            <!-- 3. Máscara de Desgaste Fotográfico para TODA la Imagen Montada -->
            <img class="full-frame-wear-overlay" id="fullWearOverlay" src="/static/full_frame_vintage_mask.jpg" onerror="this.src='/cartas_svg/full_frame_vintage_mask.jpg'" alt="Desgaste Cuadro">

            <!-- 4. Micro-polvo y fibras analógicas -->
            <img class="full-frame-dust-overlay" src="/static/full_frame_dust.png" onerror="this.src='/cartas_svg/full_frame_dust.png'" alt="Polvo Analógico">

            <!-- 5. Grano analógico y viñeteado general -->
            <div class="analog-grain-overlay" id="grainOverlay"></div>
            <div class="analog-vignette"></div>
        </div>
    </div>

    <!-- Botón discreto de ajustes y zona secreta -->
    <div class="btn-settings-toggle" id="btnOpenSettings" title="Configuración">⚙️</div>
    <div class="secret-tap-zone" id="secretZone" title="Mantener 2s para configurar"></div>

    <div class="toast-msg" id="toastMsg"></div>

    <!-- Modal de Configuración -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <h3>⚙️ Configuración del Marco</h3>
            
            <div class="info-badge">
                <div>✨ <b>Modo Revelación Web:</b> Clic sobre la carta (Sin polling continuo).</div>
                <div>📱 <b>Formato:</b> Huawei MediaPad T5 (10.1" 16:10).</div>
            </div>

            <div class="setting-row">
                <label>🖼️ Fondo Fotográfico del Marco (PNG con ventana):</label>
                <select id="bgSelect">                    <option value="/static/fondos/fondo_1.png">Fondo 1 - Oráculo Clásico</option>
                    <option value="/static/fondos/fondo_2.png">Fondo 2 - Noche Misterio</option>
                    <option value="/static/fondos/fondo_3.png">Fondo 3 - Marco Antiguo</option>
                    <option value="/static/fondos/fondo_4.png">Fondo 4 - Placa Iluminada</option>
                    <option value="/static/fondos/fondo_5.png">Fondo 5 - Escena Mágica</option>
                    <option value="/static/fondos/fondo_6.png">Fondo 6 - Arlequín Luna</option>

                </select>
            </div>

            <div class="setting-row">
                <label>URL de la API:</label>
                <input type="text" id="apiUrlInput" value="/api/carta_actual">
            </div>

            <div class="setting-row">
                <label>Tono Sepia Analógico: <span id="sepiaVal">18%</span></label>
                <input type="range" id="sepiaSlider" min="0" max="80" value="18">
            </div>

            <div class="setting-row">
                <label>Grano Analógico de Película: <span id="grainVal">18%</span></label>
                <input type="range" id="grainSlider" min="0" max="60" value="18">
            </div>

            <div class="setting-row">
                <label>Desgaste de Toda la Fotografía: <span id="fullWearVal">75%</span></label>
                <input type="range" id="fullWearSlider" min="0" max="100" value="75">
            </div>

            <div class="setting-row">
                <label>🧪 Probar Carta (Se mantendrá fija al guardar):</label>
                <select id="testCardSelect"><option value="">-- Seleccionar Carta para probar --</option>
                    <optgroup label="Corazones (♥)">
                        <option value="A_corazones">As de Corazones (A♥)</option>
                        <option value="2_corazones">2 de Corazones (2♥)</option>
                        <option value="3_corazones">3 de Corazones (3♥)</option>
                        <option value="4_corazones">4 de Corazones (4♥)</option>
                        <option value="5_corazones">5 de Corazones (5♥)</option>
                        <option value="6_corazones">6 de Corazones (6♥)</option>
                        <option value="7_corazones">7 de Corazones (7♥)</option>
                        <option value="8_corazones">8 de Corazones (8♥)</option>
                        <option value="9_corazones">9 de Corazones (9♥)</option>
                        <option value="10_corazones">10 de Corazones (10♥)</option>
                        <option value="J_corazones">Jota de Corazones (J♥)</option>
                        <option value="Q_corazones">Reina de Corazones (Q♥)</option>
                        <option value="K_corazones">Rey de Corazones (K♥)</option>
                    </optgroup>
                    <optgroup label="Diamantes (♦)">
                        <option value="A_diamantes">As de Diamantes (A♦)</option>
                        <option value="2_diamantes">2 de Diamantes (2♦)</option>
                        <option value="3_diamantes">3 de Diamantes (3♦)</option>
                        <option value="4_diamantes">4 de Diamantes (4♦)</option>
                        <option value="5_diamantes">5 de Diamantes (5♦)</option>
                        <option value="6_diamantes">6 de Diamantes (6♦)</option>
                        <option value="7_diamantes">7 de Diamantes (7♦)</option>
                        <option value="8_diamantes">8 de Diamantes (8♦)</option>
                        <option value="9_diamantes">9 de Diamantes (9♦)</option>
                        <option value="10_diamantes">10 de Diamantes (10♦)</option>
                        <option value="J_diamantes">Jota de Diamantes (J♦)</option>
                        <option value="Q_diamantes">Reina de Diamantes (Q♦)</option>
                        <option value="K_diamantes">Rey de Diamantes (K♦)</option>
                    </optgroup>
                    <optgroup label="Tréboles (♣)">
                        <option value="A_treboles">As de Treboles (A♣)</option>
                        <option value="2_treboles">2 de Treboles (2♣)</option>
                        <option value="3_treboles">3 de Treboles (3♣)</option>
                        <option value="4_treboles">4 de Treboles (4♣)</option>
                        <option value="5_treboles">5 de Treboles (5♣)</option>
                        <option value="6_treboles">6 de Treboles (6♣)</option>
                        <option value="7_treboles">7 de Treboles (7♣)</option>
                        <option value="8_treboles">8 de Treboles (8♣)</option>
                        <option value="9_treboles">9 de Treboles (9♣)</option>
                        <option value="10_treboles">10 de Treboles (10♣)</option>
                        <option value="J_treboles">Jota de Treboles (J♣)</option>
                        <option value="Q_treboles">Reina de Treboles (Q♣)</option>
                        <option value="K_treboles">Rey de Treboles (K♣)</option>
                    </optgroup>
                    <optgroup label="Picas (♠)">
                        <option value="A_picas">As de Picas (A♠)</option>
                        <option value="2_picas">2 de Picas (2♠)</option>
                        <option value="3_picas">3 de Picas (3♠)</option>
                        <option value="4_picas">4 de Picas (4♠)</option>
                        <option value="5_picas">5 de Picas (5♠)</option>
                        <option value="6_picas">6 de Picas (6♠)</option>
                        <option value="7_picas">7 de Picas (7♠)</option>
                        <option value="8_picas">8 de Picas (8♠)</option>
                        <option value="9_picas">9 de Picas (9♠)</option>
                        <option value="10_picas">10 de Picas (10♠)</option>
                        <option value="J_picas">Jota de Picas (J♠)</option>
                        <option value="Q_picas">Reina de Picas (Q♠)</option>
                        <option value="K_picas">Rey de Picas (K♠)</option>
                    </optgroup>
                </select>
            </div>

            <div class="setting-actions">
                <button class="btn btn-gold" id="btnSave">💾 Guardar Parámetros y Cerrar</button>
                <button class="btn btn-dark" id="btnResetDorso">🔄 Reiniciar al Dorso</button>
                <button class="btn btn-gold" id="btnForceCheck">⚡ Consultar Carta Actual a la API</button>
            </div>
        </div>
    </div>

    <script>
        const FONDOS_CONFIG = {"/static/fondos/fondo_1.png": {"label": "Fondo 1 - Or\u00e1culo Cl\u00e1sico", "left": "11.7%", "top": "40.3%", "width": "18.7%", "height": "19.3%"}, "/static/fondos/fondo_2.png": {"label": "Fondo 2 - Noche Misterio", "left": "20.2%", "top": "39.1%", "width": "18.2%", "height": "19.5%"}, "/static/fondos/fondo_3.png": {"label": "Fondo 3 - Marco Antiguo", "left": "21.8%", "top": "41.4%", "width": "17.6%", "height": "18.7%"}, "/static/fondos/fondo_4.png": {"label": "Fondo 4 - Placa Iluminada", "left": "29.1%", "top": "40.7%", "width": "19.4%", "height": "20.3%"}, "/static/fondos/fondo_5.png": {"label": "Fondo 5 - Escena M\u00e1gica", "left": "15.3%", "top": "41.7%", "width": "23.0%", "height": "23.9%"}, "/static/fondos/fondo_6.png": {"label": "Fondo 6 - Arlequ\u00edn Luna", "left": "11.6%", "top": "40.3%", "width": "19.3%", "height": "19.8%"}};

        let API_URL = localStorage.getItem('marco_api_url') || '/api/carta_actual';
        let currentBg = localStorage.getItem('marco_selected_bg') || '/static/fondos/fondo_6.png';
        let isRevealed = false;
        let isTestMode = false;
        let isFetching = false;
        let activeCardName = '';

        const basePhoto = document.getElementById('basePhoto');
        const bgSelect = document.getElementById('bgSelect');
        const cardAnchor = document.getElementById('cardAnchor');
        const cardFrontImg = document.getElementById('cardFrontImg');
        const settingsModal = document.getElementById('settingsModal');
        const secretZone = document.getElementById('secretZone');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(msg) {
            if (!toastMsg) return;
            toastMsg.textContent = msg;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 2500);
        }

        // Aplicar fondo y calibrar coordenadas exactas de la ventana transparente
        function applyBackground(bgKey) {
            if (!FONDOS_CONFIG[bgKey]) {
                bgKey = '/static/fondos/fondo_6.png';
            }
            currentBg = bgKey;
            basePhoto.src = currentBg;
            bgSelect.value = currentBg;

            const cfg = FONDOS_CONFIG[currentBg];
            if (cfg) {
                cardAnchor.style.left = cfg.left;
                cardAnchor.style.top = cfg.top;
                cardAnchor.style.width = cfg.width;
                cardAnchor.style.height = cfg.height;
            }
        }

        applyBackground(currentBg);

        bgSelect.addEventListener('change', (e) => {
            const newBg = e.target.value;
            if (newBg) {
                applyBackground(newBg);
                localStorage.setItem('marco_selected_bg', currentBg);
            }
        });

        // Restaurar configuraciones persistentes
        const savedSepia = localStorage.getItem('marco_sepia') || 18;
        const savedGrain = localStorage.getItem('marco_grain') || 18;
        const savedFullWear = localStorage.getItem('marco_full_wear') || 75;

        document.documentElement.style.setProperty('--analog-sepia', (savedSepia / 100.0));
        document.documentElement.style.setProperty('--grain-opacity', (savedGrain / 100.0));
        document.documentElement.style.setProperty('--full-wear-opacity', (savedFullWear / 100.0));

        // Revelación limpia y directa
        window.revealCard = function(valor, palo_id, fromTestSelector = false) {
            isRevealed = true;
            if (fromTestSelector) {
                isTestMode = true;
            }
            activeCardName = `${valor} de ${palo_id}`;

            const svgSrc = `/cartas_svg/${valor}_${palo_id}.svg`;
            
            const tempImg = new Image();
            tempImg.onload = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.onerror = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.src = svgSrc;
        };

        function resetToDorso() {
            isRevealed = false;
            isTestMode = false;
            activeCardName = '';
            cardAnchor.classList.remove('revealed');
            testCardSelect.value = '';
        }

        // Al hacer clic sobre la carta: consulta única a la API (sin polling) o vuelve al dorso
        async function handleCardClick(e) {
            if (e) e.stopPropagation();

            if (!cardAnchor.classList.contains('revealed')) {
                if (isFetching) return;
                isFetching = true;
                showToast('Consultando oráculo...');

                try {
                    const fetchUrl = API_URL.includes('?') ? `${API_URL}&_t=${Date.now()}` : `${API_URL}?_t=${Date.now()}`;
                    const res = await fetch(fetchUrl, {
                        method: 'GET',
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data.valor && data.palo_id) {
                            window.revealCard(data.valor, data.palo_id, false);
                        } else {
                            showToast('Aún no hay carta transmitida en el servidor');
                        }
                    } else {
                        showToast('Error HTTP ' + res.status);
                    }
                } catch (err) {
                    console.error('Error al consultar carta:', err);
                    showToast('Error de conexión con el servidor');
                } finally {
                    isFetching = false;
                }
            } else {
                // Si ya está revelada, al hacer clic vuelve al dorso
                resetToDorso();
            }
        }

        cardAnchor.addEventListener('click', handleCardClick);

        // Control del menú de configuración
        let pressTimer = null;
        function openSettings() {
            settingsModal.classList.add('show');
        }

        btnOpenSettings.addEventListener('click', openSettings);
        secretZone.addEventListener('touchstart', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('touchend', () => clearTimeout(pressTimer));
        secretZone.addEventListener('mousedown', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // Doble clic en cualquier parte de la imagen para abrir la configuración
        const photoContainer = document.getElementById('photoContainer');
        if (photoContainer) {
            photoContainer.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                openSettings();
            });
        }
        document.body.addEventListener('dblclick', (e) => {
            if (!settingsModal.classList.contains('show')) {
                openSettings();
            }
        });

        const apiUrlInput = document.getElementById('apiUrlInput');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const sepiaVal = document.getElementById('sepiaVal');
        const grainSlider = document.getElementById('grainSlider');
        const grainVal = document.getElementById('grainVal');
        const fullWearSlider = document.getElementById('fullWearSlider');
        const fullWearVal = document.getElementById('fullWearVal');
        const testCardSelect = document.getElementById('testCardSelect');
        const btnSave = document.getElementById('btnSave');
        const btnResetDorso = document.getElementById('btnResetDorso');
        const btnForceCheck = document.getElementById('btnForceCheck');

        apiUrlInput.value = API_URL;
        sepiaSlider.value = savedSepia;
        sepiaVal.textContent = savedSepia + '%';
        grainSlider.value = savedGrain;
        grainVal.textContent = savedGrain + '%';
        fullWearSlider.value = savedFullWear;
        fullWearVal.textContent = savedFullWear + '%';

        sepiaSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            sepiaVal.textContent = v + '%';
            document.documentElement.style.setProperty('--analog-sepia', (v / 100.0));
        });

        grainSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            grainVal.textContent = v + '%';
            document.documentElement.style.setProperty('--grain-opacity', (v / 100.0));
        });

        fullWearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            fullWearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--full-wear-opacity', (v / 100.0));
        });

        testCardSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                const parts = val.split('_');
                window.revealCard(parts[0], parts[1], true);
            }
        });

        btnSave.addEventListener('click', () => {
            API_URL = apiUrlInput.value.trim() || '/api/carta_actual';
            localStorage.setItem('marco_api_url', API_URL);
            localStorage.setItem('marco_selected_bg', currentBg);
            localStorage.setItem('marco_sepia', sepiaSlider.value);
            localStorage.setItem('marco_grain', grainSlider.value);
            localStorage.setItem('marco_full_wear', fullWearSlider.value);

            settingsModal.classList.remove('show');
        });

        btnResetDorso.addEventListener('click', () => {
            resetToDorso();
            settingsModal.classList.remove('show');
        });

        btnForceCheck.addEventListener('click', () => {
            settingsModal.classList.remove('show');
            handleCardClick();
        });
    </script>
</body>
</html>
