<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marco Analógico - Oráculo</title>
    <style>
        :root {
            --bg-frame: #020104;
            --analog-sepia: 0.18;
            --analog-brightness: 0.94;
            --analog-contrast: 1.06;
            --grain-opacity: 0.18;
            --full-wear-opacity: 0.75;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-frame);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Contenedor del lienzo de la fotografía analógica completa (1023 x 1537) */
        .photo-canvas-container {
            position: relative;
            height: 100vh;
            max-width: 100vw;
            aspect-ratio: 1023 / 1537;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050407;
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.98);
            filter: sepia(var(--analog-sepia)) brightness(var(--analog-brightness)) contrast(var(--analog-contrast));
            transition: filter 0.3s ease;
            overflow: hidden;
        }

        /* CAPA 1: Carta Interactiva (Detrás del marco transparente) */
        .card-anchor {
            position: absolute;
            left: 11.6%;
            top: 40.3%;
            width: 19.3%;
            height: 19.8%;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.35, 1);
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            background: #caa968;
        }

        /* Cara posterior (Dorso Vintage Oro/Ocre Bicycle) */
        .card-back-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.30s ease;
            z-index: 1;
            background: #1b170c;
        }

        .card-back-side img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* Cara frontal (Valores con margen interior de seguridad para no recortar trazos inferiores como el 3) */
        .card-front-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 4%;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.30s ease;
            background: linear-gradient(135deg, #dfc282 0%, #caa968 45%, #b5924e 100%);
            z-index: 2;
            padding: 2px 3px 6px 3px;
            box-sizing: border-box;
        }

        /* Sustitución limpia al revelarse */
        .card-anchor.revealed .card-front-side {
            opacity: 1;
        }
        .card-anchor.revealed .card-back-side {
            opacity: 0;
        }

        /* Vector de la carta fundido con el tono oro/ocre del dorso */
        .card-front-side img.card-svg-art {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            mix-blend-mode: multiply;
            filter: sepia(0.65) saturate(1.2) contrast(1.1);
        }

        /* CAPA 2: Fotografía PNG con Ventana Transparente */
        .base-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* CAPA 3: Efectos aplicados a TODA LA FOTOGRAFÍA MONTADA */
        .full-frame-wear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: multiply;
            opacity: var(--full-wear-opacity);
        }

        .full-frame-dust-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 26;
            mix-blend-mode: screen;
            opacity: 0.65;
        }

        .analog-grain-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .analog-vignette {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 31;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(15,8,3,0.65) 100%);
        }

        .status-dot {
            position: fixed;
            bottom: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            z-index: 100;
            transition: all 0.3s;
        }
        .status-dot.pulse {
            background: rgba(16, 185, 129, 0.9);
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.error {
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 8px #ef4444;
        }

        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #14111d;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 440px);
            color: #f1ebd8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-card h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 14px;
            text-align: center;
        }

        .diagnostic-box {
            background: #1d182b;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4b5fd;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 0.85rem;
            color: #a89bbd;
            margin-bottom: 6px;
        }

        .setting-row input[type="text"], .setting-row select {
            width: 100%;
            padding: 10px;
            background: #1e1a2b;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
        }

        .setting-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
        }
        .btn-gold:hover {
            background: #f1cf68;
        }

        .btn-dark {
            background: #2a253b;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .secret-tap-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 90px;
            height: 90px;
            z-index: 500;
        }
    </style>
</head>
<body>

    <div class="photo-canvas-container" id="photoContainer">
        <!-- 1. Carta Interactiva (Con tono Ocre/Oro idéntico al dorso) -->
        <div class="card-anchor" id="cardAnchor" title="Toca para forzar revelación">
            <div class="card-container">
                <!-- Dorso Bicycle Vintage Oro -->
                <div class="card-back-side">
                    <img id="cardBackImg" src="cartas_svg/dorso_card_crop.jpg" onerror="this.src='static/dorso_card_crop.jpg'" alt="Dorso">
                </div>
                <!-- Frente con Valores en Tono Oro/Ocre a juego -->
                <div class="card-front-side">
                    <img class="card-svg-art" id="cardFrontImg" src="cartas_svg/K_corazones.svg" alt="Carta Revelada">
                </div>
            </div>
        </div>

        <!-- 2. Fotografía PNG de Fondo con Ventana Transparente -->
        <img class="base-photo" id="basePhoto" src="fondos/fondo_6.png" alt="Fondo Marco" onerror="this.src='cartas_svg/fondo_oraculo_dorso.jpg'">

        <!-- 3. Máscara de Desgaste Fotográfico para TODA la Imagen Asentada -->
        <img class="full-frame-wear-overlay" id="fullWearOverlay" src="static/full_frame_vintage_mask.jpg" onerror="this.src='cartas_svg/full_frame_vintage_mask.jpg'" alt="Desgaste Cuadro">

        <!-- 4. Micro-polvo y fibras analógicas -->
        <img class="full-frame-dust-overlay" src="static/full_frame_dust.png" onerror="this.src='cartas_svg/full_frame_dust.png'" alt="Polvo Analógico">

        <!-- 5. Grano de película analógica y viñeteado general -->
        <div class="analog-grain-overlay" id="grainOverlay"></div>
        <div class="analog-vignette"></div>
    </div>

    <div class="status-dot" id="statusDot" title="Diagnóstico de red"></div>
    <div class="secret-tap-zone" id="secretZone" title="Mantener 2.5s para configurar"></div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <h3>⚙️ Configuración del Marco</h3>
            
            <div class="diagnostic-box" id="diagnosticBox">

            </div>

            <div class="setting-row">
                <label>🖼️ Fondo Fotográfico del Marco (PNG con ventana):</label>
                <select id="bgSelect">                    <option value="fondos/fondo_1.png">Fondo 1 - Oráculo Clásico</option>
                    <option value="fondos/fondo_2.png">Fondo 2 - Noche Misterio</option>
                    <option value="fondos/fondo_3.png">Fondo 3 - Marco Antiguo</option>

            <div class="setting-row">
                <label>Desgaste de Toda la Fotografía: <span id="fullWearVal">75%</span></label>
                <input type="range" id="fullWearSlider" min="0" max="100" value="75">

                    </optgroup>

                        <option value="A_diamantes">As de Diamantes (A♦)</option>

                        <option value="4_diamantes">4 de Diamantes (4♦)</option>
                        <option value="5_diamantes">5 de Diamantes (5♦)</option>

                    </optgroup>
                    <optgroup label="Tréboles (♣)">
                        <option value="A_treboles">As de Treboles (A♣)</option>

                    </optgroup>
                    <optgroup label="Picas (♠)">
                        <option value="A_picas">As de Picas (A♠)</option>
                        <option value="2_picas">2 de Picas (2♠)</option>
                        <option value="3_picas">3 de Picas (3♠)</option>
                        <option value="4_picas">4 de Picas (4♠)</option>
                        <option value="5_picas">5 de Picas (5♠)</option>
                        <option value="6_picas">6 de Picas (6♠)</option>

                </select>
            </div>

            <div class="setting-actions">
                <button class="btn btn-gold" id="btnSave">💾 Guardar Parámetros y Mantener Visualización</button>
                <button class="btn btn-dark" id="btnResetDorso">🔄 Reiniciar al Dorso y Reanudar Polling</button>
                <button class="btn btn-gold" id="btnForceCheck">⚡ Forzar Consulta a la API Ahora</button>
            </div>
        </div>
    </div>

    <script>
        const FONDOS_CONFIG = {"fondos/fondo_1.png": {"label": "Fondo 1 - Or\u00e1culo Cl\u00e1sico", "left": "11.7%", "top": "40.3%", "width": "18.7%", "height": "19.3%"}, "fondos/fondo_2.png": {"label": "Fondo 2 - Noche Misterio", "left": "20.2%", "top": "39.1%", "width": "18.2%", "height": "19.5%"}, "fondos/fondo_3.png": {"label": "Fondo 3 - Marco Antiguo", "left": "21.8%", "top": "41.4%", "width": "17.6%", "height": "18.7%"}, "fondos/fondo_4.png": {"label": "Fondo 4 - Placa Iluminada", "left": "29.1%", "top": "40.7%", "width": "19.4%", "height": "20.3%"}, "fondos/fondo_5.png": {"label": "Fondo 5 - Escena M\u00e1gica", "left": "15.3%", "top": "41.7%", "width": "23.0%", "height": "23.9%"}, "fondos/fondo_6.png": {"label": "Fondo 6 - Arlequ\u00edn Luna", "left": "11.6%", "top": "40.3%", "width": "19.3%", "height": "19.8%"}};

        let API_URL = localStorage.getItem('marco_api_url') || 'https://codigo-carta.vercel.app/api/carta_actual';
        let currentBg = localStorage.getItem('marco_selected_bg') || 'fondos/fondo_6.png';
        let isRevealed = false;
        let isTestMode = false;
        let activeCardName = '';
        let lastVersion = null;
        let lastUpdatedAt = null;
        let pollingTimer = null;
        const POLLING_INTERVAL_MS = 4000;

        const basePhoto = document.getElementById('basePhoto');
        const bgSelect = document.getElementById('bgSelect');
        const cardAnchor = document.getElementById('cardAnchor');
        const cardFrontImg = document.getElementById('cardFrontImg');
        const statusDot = document.getElementById('statusDot');
        const settingsModal = document.getElementById('settingsModal');
        const secretZone = document.getElementById('secretZone');

        const diagUrl = document.getElementById('diagUrl');
        const diagTime = document.getElementById('diagTime');
        const diagCard = document.getElementById('diagCard');
        const diagStatus = document.getElementById('diagStatus');

        function updateDiag(url, time, card, status) {
            if (diagUrl) diagUrl.textContent = url || API_URL;
            if (diagTime) diagTime.textContent = time || new Date().toLocaleTimeString();
            if (diagCard) diagCard.textContent = card || (isRevealed ? activeCardName : 'Ninguna (Dorso)');
            if (diagStatus) diagStatus.textContent = status || (isTestMode ? 'Modo Prueba Fijo (Polling en pausa)' : (isRevealed ? 'Carta Revelada (Polling detenido)' : 'Polling activo (4s)'));
        }

        function setDeviceBrightness(valPercent) {
            const floatVal = valPercent / 100.0;
            if (window.Android && window.Android.setBrightness) {
                try {
                    window.Android.setBrightness(floatVal);
                } catch(e) {
                    console.log('Bridge Android error:', e);
                }
            }
        }

        // Aplicar fondo y calibrar coordenadas exactas de la ventana transparente
        function applyBackground(bgKey) {
            if (!FONDOS_CONFIG[bgKey]) {
                bgKey = 'fondos/fondo_6.png';
            }
            currentBg = bgKey;
            basePhoto.src = currentBg;
            bgSelect.value = currentBg;

            const cfg = FONDOS_CONFIG[currentBg];
            if (cfg) {
                cardAnchor.style.left = cfg.left;
                cardAnchor.style.top = cfg.top;
                cardAnchor.style.width = cfg.width;
                cardAnchor.style.height = cfg.height;
                console.log('[MARCO] Coordenadas calibradas para', currentBg, cfg);
            }
        }

        applyBackground(currentBg);

        bgSelect.addEventListener('change', (e) => {
            const newBg = e.target.value;
            if (newBg) {
                applyBackground(newBg);
                localStorage.setItem('marco_selected_bg', currentBg);
            }
        });

        // Restaurar configuraciones persistentes
        const savedBright = localStorage.getItem('marco_brightness') || 30;
        const savedSepia = localStorage.getItem('marco_sepia') || 18;
        const savedGrain = localStorage.getItem('marco_grain') || 18;
        const savedFullWear = localStorage.getItem('marco_full_wear') || 75;

        setDeviceBrightness(savedBright);
        document.documentElement.style.setProperty('--analog-sepia', (savedSepia / 100.0));
        document.documentElement.style.setProperty('--grain-opacity', (savedGrain / 100.0));
        document.documentElement.style.setProperty('--full-wear-opacity', (savedFullWear / 100.0));

        // Revelación limpia y directa con color oro/ocre unificado
        window.revealCard = function(valor, palo_id, fromTestSelector = false) {
            isRevealed = true;
            if (fromTestSelector) {
                isTestMode = true;
            }
            activeCardName = `${valor} de ${palo_id}`;

            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
                console.log('[MARCO] Polling detenido: carta mostrada.');
            }

            console.log(`[MARCO] Mostrando carta en tono vintage: ${valor} de ${palo_id} (Modo Prueba: ${isTestMode})`);
            const svgSrc = `cartas_svg/${valor}_${palo_id}.svg`;
            
            const tempImg = new Image();
            tempImg.onload = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.onerror = () => {
                cardFrontImg.src = svgSrc;
                cardAnchor.classList.add('revealed');
            };
            tempImg.src = svgSrc;

            if (statusDot) {
                statusDot.className = 'status-dot pulse';
                setTimeout(() => statusDot.className = 'status-dot', 2500);
            }
            updateDiag(API_URL, new Date().toLocaleTimeString(), activeCardName, isTestMode ? 'Modo Prueba Fijo (Polling en pausa)' : '¡Carta Revelada!');
        };

        function resetToDorso() {
            isRevealed = false;
            isTestMode = false;
            activeCardName = '';
            cardAnchor.classList.remove('revealed');
            lastVersion = null;
            lastUpdatedAt = null;
            testCardSelect.value = '';
            updateDiag(API_URL, new Date().toLocaleTimeString(), 'Dorso (Inicializado)', 'Polling activo (4s)');
            startPolling();
        }

        async function pollApi(forceRevealNow = false) {
            if ((isRevealed || isTestMode) && !forceRevealNow) return;

            try {
                const fetchUrl = API_URL.includes('?') ? `${API_URL}&_t=${Date.now()}` : `${API_URL}?_t=${Date.now()}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(fetchUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    const nowStr = new Date().toLocaleTimeString();
                    
                    if (statusDot) {
                        statusDot.className = 'status-dot pulse';
                        setTimeout(() => statusDot.className = 'status-dot', 600);
                    }

                    const cardName = `${data.valor || ''} de ${data.palo_nombre || data.palo_id || ''}`;
                    updateDiag(API_URL, nowStr, cardName, isRevealed ? 'Revelada' : 'Polling activo');

                    if (forceRevealNow && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id, false);
                        return;
                    }

                    if (lastVersion === null && lastUpdatedAt === null) {
                        lastVersion = data.version || 0;
                        lastUpdatedAt = data.updated_at || '';
                        console.log('[MARCO] Estado inicial sincronizado:', lastVersion, lastUpdatedAt);
                        return;
                    }

                    const versionChanged = (data.version && data.version !== lastVersion);
                    const timeChanged = (data.updated_at && data.updated_at !== lastUpdatedAt);

                    if ((versionChanged || timeChanged) && data.valor && data.palo_id) {
                        console.log('[MARCO] ¡Detectado cambio de carta en servidor!');
                        window.revealCard(data.valor, data.palo_id, false);
                    }
                } else {
                    if (statusDot) {
                        statusDot.className = 'status-dot error';
                        setTimeout(() => statusDot.className = 'status-dot', 800);
                    }
                    updateDiag(API_URL, new Date().toLocaleTimeString(), 'Error HTTP ' + res.status, 'Fallo de respuesta');
                }
            } catch (err) {
                console.error('[MARCO] Error polling API:', err);
                if (statusDot) {
                    statusDot.className = 'status-dot error';
                    setTimeout(() => statusDot.className = 'status-dot', 800);
                }
                updateDiag(API_URL, new Date().toLocaleTimeString(), 'Error de conexión', err.message);
            }
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            if (isTestMode || isRevealed) return;
            pollApi();
            pollingTimer = setInterval(() => pollApi(false), POLLING_INTERVAL_MS);
            console.log('[MARCO] Polling iniciado cada 4s en:', API_URL);
        }

        startPolling();

        cardAnchor.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isRevealed) {
                pollApi(true);
            }
        });

        let pressTimer = null;
        function openSettings() {
            settingsModal.classList.add('show');
            updateDiag(API_URL, null, null, null);
        }

        secretZone.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(openSettings, 2200);
        });
        secretZone.addEventListener('touchend', () => clearTimeout(pressTimer));
        secretZone.addEventListener('mousedown', () => {
            pressTimer = setTimeout(openSettings, 2200);
        });
        secretZone.addEventListener('mouseup', () => clearTimeout(pressTimer));

        const apiUrlInput = document.getElementById('apiUrlInput');
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const sepiaVal = document.getElementById('sepiaVal');
        const grainSlider = document.getElementById('grainSlider');
        const grainVal = document.getElementById('grainVal');
        const fullWearSlider = document.getElementById('fullWearSlider');
        const fullWearVal = document.getElementById('fullWearVal');
        const testCardSelect = document.getElementById('testCardSelect');
        const btnSave = document.getElementById('btnSave');
        const btnResetDorso = document.getElementById('btnResetDorso');
        const btnForceCheck = document.getElementById('btnForceCheck');

        apiUrlInput.value = API_URL;
        brightSlider.value = savedBright;
        brightVal.textContent = savedBright + '%';
        sepiaSlider.value = savedSepia;
        sepiaVal.textContent = savedSepia + '%';
        grainSlider.value = savedGrain;
        grainVal.textContent = savedGrain + '%';
        fullWearSlider.value = savedFullWear;
        fullWearVal.textContent = savedFullWear + '%';

        brightSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            brightVal.textContent = v + '%';
            setDeviceBrightness(v);
        });

        sepiaSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            sepiaVal.textContent = v + '%';
            document.documentElement.style.setProperty('--analog-sepia', (v / 100.0));
        });

        grainSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            grainVal.textContent = v + '%';
            document.documentElement.style.setProperty('--grain-opacity', (v / 100.0));
        });

        fullWearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            fullWearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--full-wear-opacity', (v / 100.0));
        });

        testCardSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                const parts = val.split('_');
                window.revealCard(parts[0], parts[1], true);
            }
        });

        btnSave.addEventListener('click', () => {
            API_URL = apiUrlInput.value.trim() || 'https://codigo-carta.vercel.app/api/carta_actual';
            localStorage.setItem('marco_api_url', API_URL);
            localStorage.setItem('marco_selected_bg', currentBg);
            localStorage.setItem('marco_brightness', brightSlider.value);
            localStorage.setItem('marco_sepia', sepiaSlider.value);
            localStorage.setItem('marco_grain', grainSlider.value);
            localStorage.setItem('marco_full_wear', fullWearSlider.value);

            settingsModal.classList.remove('show');

            if (!isRevealed && !isTestMode) {
                startPolling();
            }
        });

        btnResetDorso.addEventListener('click', () => {
            resetToDorso();
            settingsModal.classList.remove('show');
        });

        btnForceCheck.addEventListener('click', () => {
            pollApi(true);
            settingsModal.classList.remove('show');
        });
    </script>
</body>
</html>
