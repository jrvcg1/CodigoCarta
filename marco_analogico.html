<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marco Analógico - Oráculo</title>
    <style>
        :root {
            --bg-frame: #050407;
            --analog-sepia: 0.16;
            --analog-brightness: 0.96;
            --analog-contrast: 1.05;
            --grain-opacity: 0.16;
            --full-wear-opacity: 0.70;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-frame);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Marco responsive con proporciones exactas de la Tablet Huawei MediaPad T5 (1024 x 1536) */
        .tablet-device-frame {
            position: relative;
            height: 100vh;
            max-height: 100vh;
            max-width: 100vw;
            aspect-ratio: 1024 / 1536;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020104;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        /* Contenedor del lienzo de la fotografía analógica */
        .photo-canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: sepia(var(--analog-sepia)) brightness(var(--analog-brightness)) contrast(var(--analog-contrast));
            transition: filter 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }

        /* CAPA 1: Fotografía Base Completa (Dorso o Carta en Blanco con papel continuo) */
        .base-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            z-index: 10;
            transition: opacity 0.30s ease;
        }

        /* CAPA 2: Proyección de Tinta Litográfica Directa en Multiply */
        .ink-anchor {
            position: absolute;
            left: 21.30%;
            top: 36.78%;
            width: 30.95%;
            height: 26.37%;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.30s ease;
            mix-blend-mode: multiply;
            padding: 4px 6px;
            box-sizing: border-box;
        }

        .ink-anchor.revealed {
            opacity: 1;
        }

        .ink-anchor img.ink-svg {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            filter: sepia(0.65) saturate(1.3) contrast(1.15);
        }

        /* CAPA 3: Efectos de Película Analógica para Toda la Fotografía */
        .full-frame-wear-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 25;
            mix-blend-mode: multiply;
            opacity: var(--full-wear-opacity);
        }

        .full-frame-dust-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 26;
            mix-blend-mode: screen;
            opacity: 0.65;
        }

        .analog-grain-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            opacity: var(--grain-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .analog-vignette {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 31;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(15,8,3,0.65) 100%);
        }

        .status-dot {
            position: fixed;
            bottom: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            z-index: 100;
            transition: all 0.3s;
        }
        .status-dot.pulse {
            background: rgba(16, 185, 129, 0.9);
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.error {
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 8px #ef4444;
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 17, 29, 0.92);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .toast-msg.show {
            opacity: 1;
        }

        .secret-tap-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            z-index: 500;
            cursor: default;
        }

        .btn-settings-toggle {
            position: fixed;
            bottom: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(20, 17, 29, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        .btn-settings-toggle:hover {
            background: rgba(20, 17, 29, 0.9);
            color: #d4af37;
            border-color: #d4af37;
        }

        /* Modal de Configuración */
        .settings-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-card {
            background: #14111d;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 24px;
            width: min(92vw, 440px);
            color: #f1ebd8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-card h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 14px;
            text-align: center;
        }

        .info-badge {
            background: #1d182b;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #c4b5fd;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 0.85rem;
            color: #a89bbd;
            margin-bottom: 6px;
        }

        .setting-row input[type="text"], .setting-row select {
            width: 100%;
            padding: 10px;
            background: #1e1a2b;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
        }

        .setting-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-gold {
            background: #d4af37;
            color: #000;
        }
        .btn-gold:hover {
            background: #f1cf68;
        }

        .btn-dark {
            background: #2a253b;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="tablet-device-frame">
        <div class="photo-canvas-container" id="photoContainer" title="Toca para revelar o reiniciar">
            <!-- 1. Fotografía Base Completa (Dorso / Carta en blanco sin recortes) -->
            <img class="base-photo" id="basePhoto" src="static/fondos/gitana_dorso.jpg" alt="Fotografía Mágica">

            <!-- 2. Proyección de Tinta Litográfica sobre la Carta en Blanco -->
            <div class="ink-anchor" id="inkAnchor">
                <img class="ink-svg" id="inkSvg" src="cartas_svg/4_corazones.svg" alt="Tinta Revelada">
            </div>

            <!-- 3. Máscara de Desgaste Fotográfico para TODA la Imagen Montada -->
            <img class="full-frame-wear-overlay" id="fullWearOverlay" src="static/full_frame_vintage_mask.jpg" onerror="this.src='cartas_svg/full_frame_vintage_mask.jpg'" alt="Desgaste Cuadro">

            <!-- 4. Micro-polvo y fibras analógicas -->
            <img class="full-frame-dust-overlay" src="static/full_frame_dust.png" onerror="this.src='cartas_svg/full_frame_dust.png'" alt="Polvo Analógico">

            <!-- 5. Grano analógico y viñeteado general -->
            <div class="analog-grain-overlay" id="grainOverlay"></div>

    </div>

    <div class="status-dot" id="statusDot" title="Diagnóstico"></div>
    <div class="btn-settings-toggle" id="btnOpenSettings" title="Configuración">⚙️</div>
    <div class="secret-tap-zone" id="secretZone" title="Mantener 2s para configurar"></div>
    <div class="toast-msg" id="toastMsg"></div>

    <!-- Modal de Configuración -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <h3>⚙️ Configuración del Marco</h3>
            
            <div class="info-badge">
                <div>📡 <b>Estado:</b> <span id="diagStatus">Sincronizado</span></div>

            </div>

            <div class="setting-row">
                <label>⚡ Modo de Revelación:</label>
                <select id="modeSelect">
                    <option value="auto">📡 Automático (Polling cada 4s por voz / Manos Libres)</option>
                    <option value="manual">👆 Manual (Revelar solo al tocar la pantalla)</option>
                </select>
            </div>

            <div class="setting-row">
                <label>🎭 Personaje / Escena del Cuadro:</label>
                <select id="themeSelect">                    <option value="gitana">🔮 La Vidente / Gitana</option>
                    <option value="buho">🦉 El Búho Sabio</option>
                    <option value="conejo">🐇 El Conejo en la Luna</option>

                </select>

            <div class="setting-row">
                <label>URL de la API:</label>
                <input type="text" id="apiUrlInput" value="https://codigo-carta.vercel.app/api/carta_actual">

            <div class="setting-row" id="rowBright">
                <label>Brillo de Hardware (Tablet): <span id="brightVal">30%</span></label>

            </div>

            <div class="setting-row">
                <label>Tono Sepia Analógico: <span id="sepiaVal">16%</span></label>

                <label>Grano Analógico de Película: <span id="grainVal">16%</span></label>
                <input type="range" id="grainSlider" min="0" max="60" value="16">
            </div>

            <div class="setting-row">
                <label>Desgaste de Toda la Fotografía: <span id="fullWearVal">70%</span></label>
                <input type="range" id="fullWearSlider" min="0" max="100" value="70">
            </div>

            <div class="setting-row">
                <label>🧪 Probar Carta (Se mantendrá fija al guardar):</label>
                <select id="testCardSelect"><option value="">-- Seleccionar Carta para probar --</option>
                    <optgroup label="Corazones (♥)">
                        <option value="A_corazones">As de Corazones (A♥)</option>
                        <option value="2_corazones">2 de Corazones (2♥)</option>
                        <option value="3_corazones">3 de Corazones (3♥)</option>
                        <option value="4_corazones">4 de Corazones (4♥)</option>
                        <option value="5_corazones">5 de Corazones (5♥)</option>
                        <option value="6_corazones">6 de Corazones (6♥)</option>
                        <option value="7_corazones">7 de Corazones (7♥)</option>
                        <option value="8_corazones">8 de Corazones (8♥)</option>
                        <option value="9_corazones">9 de Corazones (9♥)</option>
                        <option value="10_corazones">10 de Corazones (10♥)</option>
                        <option value="J_corazones">Jota de Corazones (J♥)</option>

                    </optgroup>
                    <optgroup label="Diamantes (♦)">
                        <option value="A_diamantes">As de Diamantes (A♦)</option>
                        <option value="2_diamantes">2 de Diamantes (2♦)</option>
                        <option value="3_diamantes">3 de Diamantes (3♦)</option>
                        <option value="4_diamantes">4 de Diamantes (4♦)</option>
                        <option value="5_diamantes">5 de Diamantes (5♦)</option>
                        <option value="6_diamantes">6 de Diamantes (6♦)</option>
                        <option value="7_diamantes">7 de Diamantes (7♦)</option>
                        <option value="8_diamantes">8 de Diamantes (8♦)</option>
                        <option value="9_diamantes">9 de Diamantes (9♦)</option>
                        <option value="10_diamantes">10 de Diamantes (10♦)</option>
                        <option value="J_diamantes">Jota de Diamantes (J♦)</option>
                        <option value="Q_diamantes">Reina de Diamantes (Q♦)</option>
                        <option value="K_diamantes">Rey de Diamantes (K♦)</option>
                    </optgroup>
                    <optgroup label="Tréboles (♣)">
                        <option value="A_treboles">As de Treboles (A♣)</option>
                        <option value="2_treboles">2 de Treboles (2♣)</option>
                        <option value="3_treboles">3 de Treboles (3♣)</option>
                        <option value="4_treboles">4 de Treboles (4♣)</option>
                        <option value="5_treboles">5 de Treboles (5♣)</option>
                        <option value="6_treboles">6 de Treboles (6♣)</option>
                        <option value="7_treboles">7 de Treboles (7♣)</option>
                        <option value="8_treboles">8 de Treboles (8♣)</option>
                        <option value="9_treboles">9 de Treboles (9♣)</option>
                        <option value="10_treboles">10 de Treboles (10♣)</option>
                        <option value="J_treboles">Jota de Treboles (J♣)</option>
                        <option value="Q_treboles">Reina de Treboles (Q♣)</option>

                    </optgroup>
                    <optgroup label="Picas (♠)">
                        <option value="A_picas">As de Picas (A♠)</option>
                        <option value="2_picas">2 de Picas (2♠)</option>
                        <option value="3_picas">3 de Picas (3♠)</option>
                        <option value="4_picas">4 de Picas (4♠)</option>
                        <option value="5_picas">5 de Picas (5♠)</option>
                        <option value="6_picas">6 de Picas (6♠)</option>
                        <option value="7_picas">7 de Picas (7♠)</option>
                        <option value="8_picas">8 de Picas (8♠)</option>
                        <option value="9_picas">9 de Picas (9♠)</option>
                        <option value="10_picas">10 de Picas (10♠)</option>
                        <option value="J_picas">Jota de Picas (J♠)</option>

                </select>
            </div>

            <div class="setting-actions">
                <button class="btn btn-gold" id="btnSave">💾 Guardar Parámetros y Cerrar</button>
                <button class="btn btn-dark" id="btnResetDorso">🔄 Reiniciar al Dorso</button>
                <button class="btn btn-gold" id="btnForceCheck">⚡ Consultar Carta Actual a la API</button>
            </div>
        </div>

    <script>
        const THEMES_CONFIG = {"gitana": {"label": "\ud83d\udd2e La Vidente / Gitana", "dorso": "static/fondos/gitana_dorso.jpg", "blank": "static/fondos/gitana_blank.jpg", "left": "21.30%", "top": "36.78%", "width": "30.95%", "height": "26.37%"}, "buho": {"label": "\ud83e\udd89 El B\u00faho Sabio", "dorso": "static/fondos/buho_dorso.jpg", "blank": "static/fondos/buho_blank.jpg", "left": "14.16%", "top": "33.53%", "width": "25.39%", "height": "23.44%"}, "conejo": {"label": "\ud83d\udc07 El Conejo en la Luna", "dorso": "static/fondos/conejo_dorso.jpg", "blank": "static/fondos/conejo_blank.jpg", "left": "17.09%", "top": "36.46%", "width": "23.44%", "height": "21.16%"}, "arlequin": {"label": "\ud83c\udf19 El Arlequ\u00edn en la Luna", "dorso": "static/fondos/arlequin_dorso.jpg", "blank": "static/fondos/arlequin_blank.jpg", "left": "12.70%", "top": "35.48%", "width": "24.41%", "height": "23.11%"}};

        let API_URL = localStorage.getItem('marco_api_url') || (window.location.origin && window.location.origin.includes('vercel.app') ? '/api/carta_actual' : 'https://codigo-carta.vercel.app/api/carta_actual');
        let currentThemeKey = localStorage.getItem('marco_selected_theme') || 'gitana';
        let currentMode = localStorage.getItem('marco_mode') || (window.Android ? 'auto' : 'manual');
        let isRevealed = false;
        let isTestMode = false;
        let isFetching = false;
        let activeCardName = '';
        let lastVersion = null;
        let lastUpdatedAt = null;
        let pollingTimer = null;
        const POLLING_INTERVAL_MS = 4000;

        const basePhoto = document.getElementById('basePhoto');
        const inkAnchor = document.getElementById('inkAnchor');
        const inkSvg = document.getElementById('inkSvg');
        const themeSelect = document.getElementById('themeSelect');
        const modeSelect = document.getElementById('modeSelect');
        const photoContainer = document.getElementById('photoContainer');
        const settingsModal = document.getElementById('settingsModal');
        const secretZone = document.getElementById('secretZone');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const statusDot = document.getElementById('statusDot');
        const toastMsg = document.getElementById('toastMsg');
        const diagStatus = document.getElementById('diagStatus');
        const diagCard = document.getElementById('diagCard');

        function showToast(msg) {
            if (!toastMsg) return;
            toastMsg.textContent = msg;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 2500);
        }

        function setDeviceBrightness(valPercent) {
            const floatVal = valPercent / 100.0;
            if (window.Android && window.Android.setBrightness) {
                try {
                    window.Android.setBrightness(floatVal);
                } catch(e) {
                    console.log('Bridge Android error:', e);
                }
            }
        }

        // Aplicar el tema seleccionado y calibrar posición de tinta
        function applyTheme(themeKey) {
            if (!THEMES_CONFIG[themeKey]) {
                themeKey = 'gitana';
            }
            currentThemeKey = themeKey;
            themeSelect.value = currentThemeKey;
            const theme = THEMES_CONFIG[currentThemeKey];

            inkAnchor.style.left = theme.left;
            inkAnchor.style.top = theme.top;
            inkAnchor.style.width = theme.width;
            inkAnchor.style.height = theme.height;

            if (isRevealed) {
                basePhoto.src = theme.blank;
            } else {
                basePhoto.src = theme.dorso;
            }
        }

        applyTheme(currentThemeKey);
        modeSelect.value = currentMode;

        themeSelect.addEventListener('change', (e) => {
            const newTheme = e.target.value;
            if (newTheme) {
                applyTheme(newTheme);
                localStorage.setItem('marco_selected_theme', currentThemeKey);
            }
        });

        // Restaurar configuraciones persistentes
        const savedBright = localStorage.getItem('marco_brightness') || 30;
        const savedSepia = localStorage.getItem('marco_sepia') || 16;
        const savedGrain = localStorage.getItem('marco_grain') || 16;
        const savedFullWear = localStorage.getItem('marco_full_wear') || 70;

        setDeviceBrightness(savedBright);
        document.documentElement.style.setProperty('--analog-sepia', (savedSepia / 100.0));
        document.documentElement.style.setProperty('--grain-opacity', (savedGrain / 100.0));
        document.documentElement.style.setProperty('--full-wear-opacity', (savedFullWear / 100.0));

        // Revelación Limpia por Proyección Litográfica de Tinta
        window.revealCard = function(valor, palo_id, fromTestSelector = false) {
            isRevealed = true;
            if (fromTestSelector) {
                isTestMode = true;
            }
            activeCardName = `${valor} de ${palo_id}`;

            if (currentMode === 'auto' && pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }

            const theme = THEMES_CONFIG[currentThemeKey] || THEMES_CONFIG['gitana'];
            const svgSrc = `cartas_svg/${valor}_${palo_id}.svg`;

            // Cambia la foto base al lienzo con carta en blanco y proyecta la tinta
            basePhoto.src = theme.blank;
            inkSvg.src = svgSrc;
            inkAnchor.classList.add('revealed');

            if (statusDot) {
                statusDot.className = 'status-dot pulse';
                setTimeout(() => statusDot.className = 'status-dot', 2500);
            }
            if (diagStatus) diagStatus.textContent = isTestMode ? 'Modo Prueba Fijo' : '¡Carta Revelada!';
            if (diagCard) diagCard.textContent = activeCardName;
        };

        function resetToDorso() {
            isRevealed = false;
            isTestMode = false;
            activeCardName = '';
            inkAnchor.classList.remove('revealed');
            
            const theme = THEMES_CONFIG[currentThemeKey] || THEMES_CONFIG['gitana'];
            basePhoto.src = theme.dorso;

            lastVersion = null;
            lastUpdatedAt = null;
            testCardSelect.value = '';
            if (diagStatus) diagStatus.textContent = currentMode === 'auto' ? 'Polling activo (4s)' : 'Manual (Listo)';
            if (diagCard) diagCard.textContent = 'Dorso inicial';
            if (currentMode === 'auto') startPolling();
        }

        async function pollApi(forceRevealNow = false) {
            if ((isRevealed || isTestMode) && !forceRevealNow) return;

            try {
                const fetchUrl = API_URL.includes('?') ? `${API_URL}&_t=${Date.now()}` : `${API_URL}?_t=${Date.now()}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch(fetchUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    if (statusDot) {
                        statusDot.className = 'status-dot pulse';
                        setTimeout(() => statusDot.className = 'status-dot', 600);
                    }

                    if (forceRevealNow && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id, false);
                        return;
                    }

                    if (lastVersion === null && lastUpdatedAt === null) {
                        lastVersion = data.version || 0;
                        lastUpdatedAt = data.updated_at || '';
                        return;
                    }

                    const versionChanged = (data.version && data.version !== lastVersion);
                    const timeChanged = (data.updated_at && data.updated_at !== lastUpdatedAt);

                    if ((versionChanged || timeChanged) && data.valor && data.palo_id) {
                        window.revealCard(data.valor, data.palo_id, false);
                    }
                } else {
                    if (statusDot) {
                        statusDot.className = 'status-dot error';
                        setTimeout(() => statusDot.className = 'status-dot', 800);
                    }
                }
            } catch (err) {
                if (statusDot) {
                    statusDot.className = 'status-dot error';
                    setTimeout(() => statusDot.className = 'status-dot', 800);
                }
            }
        }

        function startPolling() {
            if (pollingTimer) clearInterval(pollingTimer);
            if (currentMode !== 'auto' || isTestMode || isRevealed) return;
            pollApi();
            pollingTimer = setInterval(() => pollApi(false), POLLING_INTERVAL_MS);
        }

        if (currentMode === 'auto') {
            startPolling();
        }

        // Al hacer clic en la pantalla
        async function handleScreenClick(e) {
            if (settingsModal.classList.contains('show')) return;

            if (!isRevealed) {
                if (isFetching) return;
                isFetching = true;
                showToast('Consultando oráculo...');
                await pollApi(true);
                isFetching = false;
            } else {
                resetToDorso();
            }
        }

        photoContainer.addEventListener('click', handleScreenClick);

        // Control del menú de configuración
        let pressTimer = null;
        function openSettings() {
            settingsModal.classList.add('show');
        }

        btnOpenSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            openSettings();
        });
        secretZone.addEventListener('touchstart', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('touchend', () => clearTimeout(pressTimer));
        secretZone.addEventListener('mousedown', () => pressTimer = setTimeout(openSettings, 2000));
        secretZone.addEventListener('mouseup', () => clearTimeout(pressTimer));

        // Doble clic en cualquier parte para abrir ajustes
        photoContainer.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            openSettings();
        });
        document.body.addEventListener('dblclick', (e) => {
            if (!settingsModal.classList.contains('show')) {
                openSettings();
            }
        });

        const apiUrlInput = document.getElementById('apiUrlInput');
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const sepiaSlider = document.getElementById('sepiaSlider');
        const sepiaVal = document.getElementById('sepiaVal');
        const grainSlider = document.getElementById('grainSlider');
        const grainVal = document.getElementById('grainVal');
        const fullWearSlider = document.getElementById('fullWearSlider');
        const fullWearVal = document.getElementById('fullWearVal');
        const testCardSelect = document.getElementById('testCardSelect');
        const btnSave = document.getElementById('btnSave');
        const btnResetDorso = document.getElementById('btnResetDorso');
        const btnForceCheck = document.getElementById('btnForceCheck');

        apiUrlInput.value = API_URL;
        brightSlider.value = savedBright;
        brightVal.textContent = savedBright + '%';
        sepiaSlider.value = savedSepia;
        sepiaVal.textContent = savedSepia + '%';
        grainSlider.value = savedGrain;
        grainVal.textContent = savedGrain + '%';
        fullWearSlider.value = savedFullWear;
        fullWearVal.textContent = savedFullWear + '%';

        brightSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            brightVal.textContent = v + '%';
            setDeviceBrightness(v);
        });

        sepiaSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            sepiaVal.textContent = v + '%';
            document.documentElement.style.setProperty('--analog-sepia', (v / 100.0));
        });

        grainSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            grainVal.textContent = v + '%';
            document.documentElement.style.setProperty('--grain-opacity', (v / 100.0));
        });

        fullWearSlider.addEventListener('input', (e) => {
            const v = e.target.value;
            fullWearVal.textContent = v + '%';
            document.documentElement.style.setProperty('--full-wear-opacity', (v / 100.0));
        });

        testCardSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                const parts = val.split('_');
                window.revealCard(parts[0], parts[1], true);
            }
        });

        btnSave.addEventListener('click', () => {
            API_URL = apiUrlInput.value.trim() || 'https://codigo-carta.vercel.app/api/carta_actual';
            currentMode = modeSelect.value;
            localStorage.setItem('marco_mode', currentMode);
            localStorage.setItem('marco_api_url', API_URL);
            localStorage.setItem('marco_selected_theme', currentThemeKey);
            localStorage.setItem('marco_brightness', brightSlider.value);
            localStorage.setItem('marco_sepia', sepiaSlider.value);
            localStorage.setItem('marco_grain', grainSlider.value);
            localStorage.setItem('marco_full_wear', fullWearSlider.value);

            settingsModal.classList.remove('show');

            if (currentMode === 'auto') {
                startPolling();
            } else {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
            }
        });

        btnResetDorso.addEventListener('click', () => {
            resetToDorso();
            settingsModal.classList.remove('show');
        });

        btnForceCheck.addEventListener('click', () => {
            settingsModal.classList.remove('show');
            pollApi(true);
        });
    </script>
</body>
</html>
